# The complete openapi-generator invocation, in one committed file, so a regeneration is
# reproducible from this repository rather than from someone's shell history.
#
# Run it as `generate -c /local/generator/gen-config.yaml` inside the pinned image
# openapitools/openapi-generator-cli@sha256:2ab0a9680222de65dc9d3baf861aa02b99e1b80c211d8221ebf3ae8f8a102524.
# The npm wrapper has a settings file of its own; that mechanism belongs to the wrapper and the
# string does not appear anywhere in this image's jar, so `-c` with this file is the supported
# form here.
#
# Generation must always run inside the image, on a dev machine and in CI alike:
# .openapi-generator/FILES is written with the platform line separator, so a host run and a
# container run differ in that one file for a reason that has nothing to do with the spec.
generatorName: csharp
library: generichost
inputSpec: /local/spec/openapi.generated.json
outputDir: /local

# On, and it passes. It was off because the served document did not validate: StaticResourceController
# carried an empty route alongside its {path} one, so the operation generated for "/" declared a
# required path parameter nothing could resolve, and a validator rejects the whole file over it.
# Whisparr excludes that controller from document generation as of 3.6.1, so the document validates
# and this is a gate rather than a workaround. Measured against 3.6.2.1727: generation
# exits 0 and the five generated subdirectories are byte-identical to a run with validation off.
#
# The boolean config key is inverted from the CLI flag of the opposite name. The flag's own spelling
# is NOT a key here: an unrecognised key is swallowed silently into a dynamic-properties bag.
validateSpec: true

# RepositoryUrl in the generated csproj is assembled from these three and from nothing else.
gitHost: github.com
gitUserId: alextomas955
gitRepoId: Whisparr3.Net

# Suppression by denylist. Never allowlist supportingFiles: for apis, models and supportingFiles
# the value is a colon-separated allowlist, and naming one file restricts generation to it, which
# measurably deleted the entire runtime.
#
# apiDocs and modelDocs are off because the markdown this generator writes describes methods that
# do not exist. Measured against generator 7.25.0 by generating with them enabled and comparing every documented
# signature against the code from the same run: not one matched. Every documented name lacks the
# Async suffix, every declared return type is wrong, docs saying List<MovieResource> where the code
# has Task<IGetCalendarApiResponse>. Parameters differ too, DateTime start = null against
# Option<DateTime> start = default, which is not even valid C#.
#
# The cause is upstream and is not a misconfiguration here. csharp/libraries/generichost ships its
# own api.mustache and no api_doc.mustache or model_doc.mustache. Docs
# therefore fall back to the shared csharp/api_doc.mustache, written for the older restsharp and
# httpclient libraries, which prints the synchronous shape. Verified against openapi-generator
# master: both files are absent for every csharp library, and the project's own generichost
# Petstore sample carries the same mismatch, `void AddPet (Pet pet)` in the doc against
# Task<IAddPetApiResponse> AddPetAsync in the code beside it.
#
# apiTests and modelTests are off because the generated suite asserts nothing. Every model test
# body is a TODO comment and every api test carries [Fact (Skip = "not implemented")], so the whole
# suite runs green having verified nothing. It also emits its own csproj into src/, which this
# repository keeps free of test projects, and names the assembly Whisparr3.Net.Test, which does not
# exist here.
#
# A consumer's API reference is the XML documentation the package already ships, which the compiler
# derives from the assembly and so cannot contradict it.
globalProperties:
  apiTests: "false"
  modelTests: "false"
  apiDocs: "false"
  modelDocs: "false"

# The scaffolding this repository owns by hand or does not want at all. This is the config-file
# equivalent of the ignore file, and unlike the ignore file it is rewritten on every run.
#
# "**/*.csproj" is here because the project file is hand-owned rather than generated. Measured
# 2026-09-04 against the csproj this generator actually emits: it carries six placeholder metadata
# values that Directory.Build.props exists to correct, Authors, Company, Description, Copyright,
# Version and PackageReleaseNotes. It also hardcodes RepositoryUrl and RepositoryType, and a
# hardcoded RepositoryUrl overrides the PublishRepositoryUrl auto-detection the props rely on, so
# the shipped .snupkg carries no commit SHA and the source map is dead.
#
# src/Whisparr3.Net/Extensions/IHttpClientBuilderExtensions.cs is here because it is the only
# file in the generated tree that uses Polly, and keeping it makes Microsoft.Extensions.Http.Polly
# a hard dependency of the package. Measured against generator 7.25.0 by publishing a consumer: that reference
# resolves Polly 7.2.4 and Polly.Extensions.Http 3.0.0, adding 327 KB across three assemblies to
# every consumer, and pinning the previous Polly major on a consumer that wants Polly 8 through
# Microsoft.Extensions.Http.Resilience. The three methods it holds are one-line wrappers over
# AddPolicyHandler, and Whisparr3Options.ConfigureHttpClient already hands a consumer the
# IHttpClientBuilder they need to call that themselves with whatever resilience package they chose.
#
# The .openapi-generator-ignore committed at the repository root is a record of what this key
# produced, never an input. Generation stages only spec/openapi.generated.json and
# generator/gen-config.yaml into a fresh root, so the generator never reads the committed file and
# a hand edit to it is discarded silently on the next run. Edit this key instead.
openapiGeneratorIgnoreList:
  - README.md
  - src/*/README.md
  - .gitignore
  - appveyor.yml
  - "*.sln"
  - "*.slnx"
  - "docs/**"
  - api/openapi.yaml
  - "**/*.csproj"
  - src/Whisparr3.Net/Extensions/IHttpClientBuilderExtensions.cs

additionalProperties:
  packageName: Whisparr3.Net
  targetFramework: net8.0;net10.0
  # Arbitrary when it was generated and fixed forever now. Left unset the generator emits a fresh
  # random GUID on every run, which rewrites the solution and project GUID.
  #
  # With this configuration the pin is INERT. Two runs differ in 0 files whether the GUID is pinned
  # or not, because the only file it reaches is the solution, and "*.sln" is suppressed by
  # openapiGeneratorIgnoreList four keys above. The generator log states it outright:
  # `Ignored /local/Whisparr3.Net.sln (Ignored by rule in ignore file.)`. Remove "*.sln" from that
  # list and two unpinned runs then differ in exactly one file, Whisparr3.Net.sln.
  #
  # The pin stays, for two reasons. It is what keeps this invocation complete and pinned, and it
  # becomes load-bearing the moment anyone stops suppressing the solution file. What is NOT true
  # is that it is currently what makes generation deterministic - the ignore list is. Do not
  # delete the ignore entry on the assumption that this pin covers it.
  packageGuid: "{1EDF3552-B7CE-4C36-A15C-810845C3F203}"

# Deliberately absent, each with its reason:
#   - the duplicate-operationId repair, because it de-duplicates by appending a positional suffix.
#     That masks the collision assertion in generator/preprocess_spec.py, and inserting an operation
#     upstream then moves the suffix onto a different method and renames public API with no diff.
#     Measured against 3.6.2.1727: this document carries no duplicate operationId to repair.
#   - the security-scheme filter, because generator/preprocess_spec.py narrows the root requirement
#     to the header scheme instead, before the generator sees the document
#   - the generation-timestamp option, which already defaults to the value this repository wants
#     for this generator and injects a build-date line when set the other way
#   - useSourceGeneration, a generichost-only option whose generator default is false. It works:
#     turned on against 3.6.2.1727 it compiles with 0 errors and 0 warnings on both net8.0 and
#     net10.0 and passes all 63 tests, and the generated contexts are wired, because
#     HostConfiguration combines them into _jsonOptions.TypeInfoResolver with a
#     DefaultJsonTypeInfoResolver fallback. It stays off because it adds 191 public
#     <Model>SerializationContext types to the package surface and the benefit it buys here has not
#     been measured. Turn it on as its own change with a benchmark, not as a flag flip.
#   - disallowAdditionalPropertiesIfNotPresent, whose false value is the OAS-compliant one. Setting
#     it changes exactly one model against 3.6.2.1727, CommandResource, which is the only schema
#     Whisparr leaves unconstrained. What it adds there is dead: a public
#     [JsonExtensionData] AdditionalProperties dictionary that the generated JsonConverter neither
#     reads into nor writes from, so it is always empty and prints in ToString. It does not make
#     CommandApi.SendCommandAsync unnecessary.
#   - modelNameMappings, because the collision count is zero. A collision needs a schema name that
#     is also a real BCL type. Measured against the 191 schemas of 3.6.2.1727:
#     Command, Field and Severity are schemas here and no System.Command, System.Field or
#     System.Severity exists, while TimeSpan and Version are BCL types that are not schemas here.
#     The generated tree compiles with 0 errors on both net8.0 and net10.0 with no mappings at all.
#     That compile is what settled it, and it is what re-settles it on every refresh.
